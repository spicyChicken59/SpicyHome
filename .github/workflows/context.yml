name: Update city context
on:
  schedule:
    - cron: '47 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spicyhome-tracking
  cancel-in-progress: false
jobs:
  context:
    if: vars.SPICYHOME_TRACKING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AFDC_API_KEY: ${{ secrets.AFDC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh regional context
        run: python src/city_context.py
      - name: Commit observed city context
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh regional transit and charging context'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
