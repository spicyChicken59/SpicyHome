name: Publish website
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/publish.yml', 'tools/check_site.py']
  workflow_dispatch:
  workflow_run:
    workflows: [Track apartments, Update city context]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: spicyhome-pages
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      vars.SPICYHOME_PAGES_ENABLED == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_run'
          || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the committed public site
        run: python tools/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the committed website
        id: deploy
        uses: actions/deploy-pages@v4
